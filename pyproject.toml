[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hotspot-gui"
version = "0.1.0"
description = "A GUI for managing NetworkManager hotspots via D-Bus"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "sdbus>=0.12.0",
    "sdbus-networkmanager>=0.12.0"
]

[project.scripts]
hotspot-gui = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
